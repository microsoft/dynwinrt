[package]
name = "dynwinrt-win32-contracts"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native-independent Win32 call contracts and structural validation"
repository = "https://github.com/microsoft/dynwinrt"
authors = ["Microsoft"]

[features]
schema = ["dep:schemars"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", optional = true }

[dev-dependencies]
schemars = "1"
