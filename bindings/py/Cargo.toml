[package]
name = "dynwinrt-py"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Python bindings for dynwinrt via PyO3"
repository = "https://github.com/microsoft/dynwinrt"
authors = ["Microsoft"]
[lib]
name = "dynwinrt_py"
crate-type = ["cdylib"]

[dependencies]
dynwinrt = { path = "../../crates/dynwinrt" }
pyo3 = "0.29.0"
pyo3-async-runtimes = { version = "0.29.0", features = ["tokio-runtime"] }
pollster = "0.4.0"
tokio = { version = "1.49.0", features = ["rt-multi-thread"] }

[dependencies.windows]
version = ">=0.59, <=0.62"
features = [
    "ApplicationModel",
    "Foundation",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_WindowsProgramming",
    "Win32_System_WinRT",
]
