
[package]
authors = ["Microsoft"]
edition = "2021"
name = "jswinrt_rs"
version = "0.1.0"
license = "MIT"
description = "JavaScript/TypeScript bindings for dynwinrt via napi-rs"
repository = "https://github.com/microsoft/dynwinrt"

[lib]
crate-type = ["cdylib"]

[features]
test-hooks = ["windows/Win32_System_Wmi"]

[dependencies]
napi = { version = "3", features = ["napi7"] }
napi-derive = "3.0.0"
dynwinrt = { path = "../../crates/dynwinrt" }
windows-future = "0.3.2"
windows-string = "0.0.0"
pollster = "0.4.0"
serde_json = "1"

[dependencies.windows]
version = ">=0.59, <=0.62"
features = [
    "Data_Xml_Dom",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_Storage_Packaging_Appx",
    "Web_Http",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_WindowsProgramming",
    "Win32_System_LibraryLoader",
    "Win32_System_WinRT",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Memory",
    "Win32_System_Variant",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Networking_BackgroundIntelligentTransferService",
    "Win32_System_Hypervisor",
    "Win32_UI_WindowsAndMessaging",
    "Foundation",
    "Devices_Geolocation",
    "Web_Http",
]



[build-dependencies]
cc = "1"
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
