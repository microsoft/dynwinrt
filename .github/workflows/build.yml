name: Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: windows-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Classify the entire PR diff
        id: classify
        run: python eng\ci\classify_changes.py

  format:
    needs: changes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.docs_only == 'false'
        with:
          components: rustfmt
      - name: Check Rust formatting
        if: needs.changes.outputs.docs_only == 'false'
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Rust formatting failed. Run 'cargo fmt --all' and commit the changes."
            exit 1
          }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test CI scheduling and artifact contracts
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install -r eng\ci\requirements.txt --quiet
          python -m unittest discover -s eng\ci -p "test_*.py" -v
          node --test bindings\js\scripts\run-codegen.test.mjs
          .\tests\e2e\e2e_preparation.tests.ps1
          .\tests\e2e\prebuilt_codegen.tests.ps1

  # Rust test programs are independent builds, not reusable runtime packages.
  test-rust:
    if: needs.changes.outputs.docs_only == 'false'
    needs: [changes, format]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install declaration test compiler
        shell: pwsh
        run: |
          npm install --prefix target/tsc --no-save --ignore-scripts --no-package-lock typescript@5.9.3
          $tsc = (Resolve-Path target/tsc/node_modules/typescript/bin/tsc).Path
          $windowsWinmd = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\UnionMetadata' `
            -Filter Windows.winmd -File -Recurse |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $windowsWinmd) {
            throw 'Windows SDK metadata is required for declaration tests'
          }
          "DYNWINRT_TSC=$tsc" >> $env:GITHUB_ENV
          "DYNWINRT_WINDOWS_WINMD=$($windowsWinmd.FullName)" >> $env:GITHUB_ENV
          "DYNWINRT_REQUIRE_TSC=1" >> $env:GITHUB_ENV
      - uses: NuGet/setup-nuget@v2
      - name: Install Win32 metadata
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'win32metadata'
          nuget install Microsoft.Windows.SDK.Win32Metadata `
            -Version 71.0.14-preview `
            -OutputDirectory $root `
            -DirectDownload `
            -NonInteractive
          $winmd = Get-ChildItem $root -Filter Windows.Win32.winmd -File -Recurse |
            Select-Object -First 1
          if (-not $winmd) {
            throw 'Microsoft.Windows.SDK.Win32Metadata did not contain Windows.Win32.winmd'
          }
          "DYNWINRT_WIN32_WINMD=$($winmd.FullName)" >> $env:GITHUB_ENV
          "DYNWINRT_REQUIRE_WIN32_METADATA=1" >> $env:GITHUB_ENV
      - name: Test core library
        run: cargo test -p dynwinrt-com-contracts -p dynwinrt-win32-contracts -p dynwinrt
      - name: Test native-independent contracts on i686
        run: cargo test -p dynwinrt-com-contracts -p dynwinrt-win32-contracts --target i686-pc-windows-msvc
      - name: Test borrowed-copy ABI on live i686
        run: cargo test -p dynwinrt --target i686-pc-windows-msvc --lib borrowed_copy
      - name: Test dynwinrt-codegen
        run: cargo test -p dynwinrt-codegen
      - name: Test Win32 binding boundaries and lifetimes
        run: cargo test -p jswinrt_rs --lib win32
      - name: Enforce flat Win32 coverage baseline
        shell: pwsh
        run: |
          $json = cargo run -p dynwinrt-codegen --quiet -- win32-census `
            --winmd $env:DYNWINRT_WIN32_WINMD --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = $json | ConvertFrom-Json
          if ($result.eligible_functions -ne 18321 -or $result.complete_functions -lt 8936) {
            throw "Flat Win32 coverage regressed: $($result.complete_functions)/$($result.eligible_functions)"
          }
          Write-Host "Flat Win32 coverage: $($result.complete_functions)/$($result.eligible_functions)"
      - name: Test raw union MSVC C oracle (x64)
        run: cargo test -p jswinrt_rs --features test-hooks com_raw::tests::msvc_c_union_oracle_executes_through_libffi -- --exact
      - name: Test raw union MSVC C oracle (live i686)
        run: cargo test -p jswinrt_rs --features test-hooks --target i686-pc-windows-msvc com_raw::tests::msvc_c_union_oracle_executes_through_libffi -- --exact
      - name: Enforce Classic COM coverage baseline
        shell: pwsh
        run: |
          $json = cargo run -p dynwinrt-codegen --quiet -- com-census `
            --winmd $env:DYNWINRT_WIN32_WINMD `
            --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = $json | ConvertFrom-Json
          if ($result.eligible_interfaces -ne 7929) {
            throw "Classic COM census denominator changed: $($result.eligible_interfaces)"
          }
          if ($result.complete_interfaces -lt 5721) {
            throw "Classic COM complete coverage regressed: $($result.complete_interfaces)"
          }
          if ($result.coverage_percent -lt 70.0) {
            throw "Classic COM coverage fell below 70%: $($result.coverage_percent)"
          }
          Write-Host "Classic COM coverage: $($result.complete_interfaces)/$($result.eligible_interfaces) ($($result.coverage_percent)%)"
      - name: Enforce Classic COM raw capability baseline
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'classic-com-capability'
          cargo run -p dynwinrt-codegen --quiet -- com-capability-census `
            --winmd $env:DYNWINRT_WIN32_WINMD `
            --output-dir $output | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = Get-Content (Join-Path $output 'classic-com-capability-summary.json') -Raw |
            ConvertFrom-Json
          if ($result.eligible_interfaces -ne 7929 -or $result.safe_complete -ne 5721) {
            throw "Classic COM safe totals changed in capability census"
          }
          $support = Import-Csv (Join-Path $output 'classic-com-interface-support.csv')
          if (
            @($support).Count -ne 7929 -or
            @($support | Where-Object { $_.safe_complete -eq 'true' }).Count -ne 5721 -or
            @($support | Where-Object { $_.safe_complete -eq 'false' }).Count -ne 2208
          ) {
            throw "Classic COM compact interface support index changed"
          }
          foreach ($name in @('IAudioRenderClient', 'IAudioCaptureClient', 'IMFMediaBuffer')) {
            $copyOnly = @($support | Where-Object { $_.name -eq $name })
            if ($copyOnly.Count -ne 1 -or $copyOnly[0].safe_complete -ne 'false') {
              throw "Bounded copy facade $name was incorrectly counted as complete"
            }
          }
          $expected = @{
            x64 = @(388, 1431, 389)
            i686 = @(387, 1408, 413)
            arm64 = @(388, 1431, 389)
          }
          foreach ($target in @('x64', 'i686', 'arm64')) {
            $counts = $result.targets.$target
            if (
              $counts.safe_incomplete_raw_metadata_complete -ne $expected[$target][0] -or
              $counts.safe_incomplete_raw_manual_contract -ne $expected[$target][1] -or
              $counts.safe_incomplete_raw_runtime_blocked -ne $expected[$target][2]
            ) {
              throw "Classic COM raw capability totals changed for $target"
            }
          }
          if (
            $result.safeEvidence.safeComplete -ne 5721 -or
            $result.safeEvidence.standardDerived -ne 5355 -or
            $result.safeEvidence.exactRegistryDependent -ne 366 -or
            $result.safeEvidence.metadataFactOccurrences -ne 6012 -or
            $result.safeEvidence.comStandardFactOccurrences -ne 26247 -or
            $result.safeEvidence.registeredExactEntries -ne 532 -or
            $result.safeEvidence.metadataMatchedExactEntries -ne 532 -or
            $result.safeEvidence.safeConsumedExactEntries -ne 431 -or
            $result.safeEvidence.exactEntryInterfaceDependencies -ne 694 -or
            $result.safeEvidence.exactFamilyInterfaceDependencies -ne 425
          ) {
            throw "Classic COM safe evidence dependency census changed"
          }
          $statuses = @($result.safeEvidence.exactEntryStatus.psobject.Properties.Value)
          if (
            @($statuses | Where-Object { -not $_.registered -or -not $_.metadataMatched }).Count -ne 0 -or
            @($statuses | Where-Object { $_.familyId -eq 'com.ownership.v1' }).Count -ne 169 -or
            @($statuses | Where-Object { $_.familyId -eq 'com.ownership.v1' -and $_.safeConsumed }).Count -ne 118 -or
            @($statuses | Where-Object { $_.familyId -eq 'windows.borrowed-hwnd-output.v1' }).Count -ne 22 -or
            @($statuses | Where-Object { $_.familyId -eq 'com.enumerator-next-exception.v1' }).Count -ne 73 -or
            @($statuses | Where-Object { $_.familyId -eq 'audio.conditional-output.v1' }).Count -ne 1 -or
            @($statuses | Where-Object { $_.familyId -eq 'audio.context-effect.v1' }).Count -ne 3 -or
            @($statuses | Where-Object { $_.familyId -eq 'buffers.borrowed-copy.v1' }).Count -ne 23
          ) {
            throw "Classic COM exact registry entry validation changed"
          }
          $interfaces = Import-Csv (Join-Path $output 'classic-com-interface-capabilities.csv')
          $fsrm = $interfaces | Where-Object { $_.name -eq 'IFsrmFileManagementJob' }
          if (@($fsrm.exact_entry_ids | ConvertFrom-Json).Count -ne 7) {
            throw "IFsrmFileManagementJob exact SAFEARRAY entry granularity changed"
          }
          $second = Join-Path $env:RUNNER_TEMP 'classic-com-capability-second'
          cargo run -p dynwinrt-codegen --quiet -- com-capability-census `
            --winmd $env:DYNWINRT_WIN32_WINMD `
            --output-dir $second | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $firstFiles = Get-ChildItem $output -File | Sort-Object Name
          $secondFiles = Get-ChildItem $second -File | Sort-Object Name
          if (($firstFiles.Name -join '|') -ne ($secondFiles.Name -join '|')) {
            throw 'Classic COM capability artifact sets differ'
          }
          foreach ($file in $firstFiles) {
            $other = Join-Path $second $file.Name
            if (
              (Get-FileHash $file.FullName -Algorithm SHA256).Hash -ne
              (Get-FileHash $other -Algorithm SHA256).Hash
            ) {
              throw "Classic COM capability artifact drift: $($file.Name)"
            }
          }
          $retained = Join-Path $env:GITHUB_WORKSPACE 'docs\status\generated'
          $retainedNames = @(
            'classic-com-capability-summary.json',
            'classic-com-interface-support.csv'
          )
          $retainedFiles = Get-ChildItem $retained -File |
            Where-Object { $retainedNames -contains $_.Name } |
            Sort-Object Name
          if (($retainedNames -join '|') -ne ($retainedFiles.Name -join '|')) {
            throw 'Retained Classic COM capability artifact set is stale'
          }
          foreach ($name in $retainedNames) {
            $generated = Join-Path $output $name
            $committed = Join-Path $retained $name
            if (
              (Get-FileHash $generated -Algorithm SHA256).Hash -ne
              (Get-FileHash $committed -Algorithm SHA256).Hash
            ) {
              throw "Retained Classic COM capability artifact drift: $name"
            }
          }
      - name: Upload complete Classic COM capability report
        uses: actions/upload-artifact@v4
        with:
          name: classic-com-capability-report
          path: ${{ runner.temp }}\classic-com-capability
          if-no-files-found: error
          retention-days: 14
      - name: Test Classic COM failure cleanup contracts
        run: |
          cargo test -p dynwinrt failing_hresult_releases_written_interface_output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p dynwinrt automation_validation_failure_cleans_other_owned_outputs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p dynwinrt bstr_in_out_failure_cleans_unchanged_replaced_and_null_slots
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p dynwinrt excep_info_deferred_fill_runs_once_and_cleans_on_every_failure_path
      - name: Check x86 Classic COM runtime
        run: cargo check -p jswinrt_rs --target i686-pc-windows-msvc

  # Producers start beside Rust tests. Only current-run, configuration-specific
  # payloads are reusable; neither a Cargo target tree nor a test program is shared.
  build-codegen-x64:
    if: needs.changes.outputs.docs_only == 'false'
    needs: [changes, format]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build x64 codegen
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build -p dynwinrt-codegen --release --target x86_64-pc-windows-msvc
          New-Item -ItemType Directory artifacts\codegen-x64\payload -Force | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\dynwinrt-codegen.exe artifacts\codegen-x64\payload
          .\eng\ci\artifact.ps1 -Mode Write -Path artifacts\codegen-x64 -Kind codegen -Architecture x64
      - uses: actions/upload-artifact@v4
        with:
          name: ci-codegen-x64
          path: artifacts\codegen-x64
          if-no-files-found: error
          retention-days: 7

  build-bindings-x64:
    if: needs.changes.outputs.docs_only == 'false'
    needs: [changes, format]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Build production JS binding
        working-directory: bindings/js
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm install
          npx napi build --no-const-enum --platform --release --target x86_64-pc-windows-msvc -o dist
          npm run build:entrypoints --silent
          node scripts\verify-runtime-artifact.mjs dist
      - name: Stage production JS artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory artifacts\js-x64 -Force | Out-Null
          Copy-Item bindings\js\dist artifacts\js-x64\payload -Recurse
          .\eng\ci\artifact.ps1 -Mode Write -Path artifacts\js-x64 -Kind js -Architecture x64
      - uses: actions/upload-artifact@v4
        with:
          name: ci-js-x64
          path: artifacts\js-x64
          if-no-files-found: error
          retention-days: 7
      - name: Build Python binding
        working-directory: bindings/py
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install "maturin>=1.11,<2" --quiet
          python -m maturin build --quiet --interpreter python --target x86_64-pc-windows-msvc `
            --out ..\..\artifacts\python-x64\payload
          ..\..\eng\ci\artifact.ps1 -Mode Write -Path ..\..\artifacts\python-x64 `
            -Kind python -Architecture x64 -Profile dev -PythonAbi cp312
      - uses: actions/upload-artifact@v4
        with:
          name: ci-python-x64
          path: artifacts\python-x64
          if-no-files-found: error
          retention-days: 7

  build-js-test-hooks:
    if: needs.changes.outputs.docs_only == 'false'
    needs: [changes, format]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build isolated JS native fixtures
        working-directory: bindings/js
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm install
          npx napi build --no-const-enum --platform --release --target x86_64-pc-windows-msvc --features test-hooks -o dist
          npm run build:entrypoints --silent
          node scripts\verify-runtime-artifact.mjs dist --test-hooks
      - name: Stage test-hooks artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory artifacts\js-test-hooks-x64 -Force | Out-Null
          Copy-Item bindings\js\dist artifacts\js-test-hooks-x64\payload -Recurse
          .\eng\ci\artifact.ps1 -Mode Write -Path artifacts\js-test-hooks-x64 `
            -Kind js -Architecture x64 -Features test-hooks
      - uses: actions/upload-artifact@v4
        with:
          name: ci-js-test-hooks-x64
          path: artifacts\js-test-hooks-x64
          if-no-files-found: error
          retention-days: 7

  build-arm64:
    if: needs.changes.outputs.docs_only == 'false'
    needs: [changes, format]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build ARM64 codegen
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build -p dynwinrt-codegen --release --target aarch64-pc-windows-msvc
          New-Item -ItemType Directory artifacts\codegen-arm64\payload -Force | Out-Null
          Copy-Item target\aarch64-pc-windows-msvc\release\dynwinrt-codegen.exe artifacts\codegen-arm64\payload
          .\eng\ci\artifact.ps1 -Mode Write -Path artifacts\codegen-arm64 -Kind codegen -Architecture arm64
      - uses: actions/upload-artifact@v4
        with:
          name: ci-codegen-arm64
          path: artifacts\codegen-arm64
          if-no-files-found: error
          retention-days: 7
      - name: Build production ARM64 JS binding
        working-directory: bindings/js
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm install
          npx napi build --no-const-enum --platform --release --target aarch64-pc-windows-msvc -o dist
          npm run build:entrypoints --silent
      - name: Stage ARM64 JS artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory artifacts\js-arm64 -Force | Out-Null
          Copy-Item bindings\js\dist artifacts\js-arm64\payload -Recurse
          .\eng\ci\artifact.ps1 -Mode Write -Path artifacts\js-arm64 -Kind js -Architecture arm64
      - name: Compile raw union MSVC C oracle for ARM64
        run: cargo test -p jswinrt_rs --features test-hooks --target aarch64-pc-windows-msvc --no-run
      - uses: actions/upload-artifact@v4
        with:
          name: ci-js-arm64
          path: artifacts\js-arm64
          if-no-files-found: error
          retention-days: 7

  # Production E2E never waits for the ARM64 lane or the Rust test job.
  e2e-runtime:
    if: needs.changes.outputs.docs_only == 'false'
    needs: [changes, build-codegen-x64, build-bindings-x64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - uses: actions/download-artifact@v4
        with:
          name: ci-codegen-x64
          path: artifacts\codegen-x64
      - uses: actions/download-artifact@v4
        with:
          name: ci-js-x64
          path: artifacts\js-x64
      - uses: actions/download-artifact@v4
        with:
          name: ci-python-x64
          path: artifacts\python-x64
      - name: Verify production input artifacts
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          .\eng\ci\artifact.ps1 -Mode Verify -Path artifacts\codegen-x64 -Kind codegen -Architecture x64
          .\eng\ci\artifact.ps1 -Mode Verify -Path artifacts\js-x64 -Kind js -Architecture x64
          .\eng\ci\artifact.ps1 -Mode Verify -Path artifacts\python-x64 -Kind python -Architecture x64 -Profile dev -PythonAbi cp312
          Copy-Item artifacts\js-x64\payload bindings\js\dist -Recurse
          node bindings\js\scripts\verify-runtime-artifact.mjs bindings\js\dist
          "DYNWINRT_CODEGEN=$((Resolve-Path artifacts\codegen-x64\payload\dynwinrt-codegen.exe).Path)" >> $env:GITHUB_ENV
      - uses: NuGet/setup-nuget@v2
      - name: Install Win32 metadata
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'win32metadata'
          nuget install Microsoft.Windows.SDK.Win32Metadata `
            -Version 71.0.14-preview `
            -OutputDirectory $root `
            -DirectDownload `
            -NonInteractive
          $winmd = Get-ChildItem $root -Filter Windows.Win32.winmd -File -Recurse |
            Select-Object -First 1
          if (-not $winmd) {
            throw 'Microsoft.Windows.SDK.Win32Metadata did not contain Windows.Win32.winmd'
          }
          "DYNWINRT_WIN32_WINMD=$($winmd.FullName)" >> $env:GITHUB_ENV
          "DYNWINRT_REQUIRE_WIN32_METADATA=1" >> $env:GITHUB_ENV
      - name: Install JS test dependencies
        working-directory: bindings/js
        run: npm install
      - name: Test JS binding
        working-directory: bindings/js
        run: npm test
      - name: Install prebuilt Python binding
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m venv bindings\py\.venv
          $python = '.\bindings\py\.venv\Scripts\python.exe'
          & $python -m pip install pytest "mypy>=1.13,<2" "coverage>=7.15,<8" --quiet
          $wheels = @(Get-ChildItem artifacts\python-x64\payload -Filter *.whl -File)
          if ($wheels.Count -ne 1) { throw 'Expected exactly the verified CPython 3.12 x64 wheel' }
          & $python -m pip install $wheels[0].FullName --no-deps --no-index --quiet
      - name: Test Python binding
        run: |
          .\bindings\py\.venv\Scripts\python.exe -m pytest bindings\py\tests -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\bindings\py\.venv\Scripts\python.exe -m mypy.stubtest dynwinrt --allowlist bindings\py\stubtest_allowlist.txt --ignore-disjoint-bases
      - name: Test generated Python long paths
        run: |
          .\eng\release\python\test_generated_python_long_paths.ps1 `
            -Python .\bindings\py\.venv\Scripts\python.exe `
            -Codegen $env:DYNWINRT_CODEGEN
      - name: Test generated implementation symbol identities
        shell: pwsh
        run: |
          $env:DYNWINRT_TEST_PYTHON = (Resolve-Path .\bindings\py\.venv\Scripts\python.exe).Path
          $env:DYNWINRT_REQUIRE_IMPLEMENTATION_RUNTIME = '1'
          cargo test -p dynwinrt-codegen --test implementation_naming_test
      - name: Run E2E tests
        run: .\tests\e2e\e2e_test.ps1 -SkipBuild -Codegen $env:DYNWINRT_CODEGEN
      # This optional-SDK behavioral smoke is separate from generated coverage
      # totals. The receiver/GIL regressions also run in instrumented core and
      # binding tests; no WinAppSDK runtime bootstrap or UI loop is needed here.
      - name: Test metadata-generated dispatcher implementation
        shell: pwsh
        run: |
          $packages = Join-Path $env:RUNNER_TEMP 'dispatcher-metadata'
          nuget install Microsoft.WindowsAppSDK.InteractiveExperiences `
            -Version 1.8.251104001 -OutputDirectory $packages -DirectDownload -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $metadata = Join-Path $packages 'Microsoft.WindowsAppSDK.InteractiveExperiences.1.8.251104001\metadata\10.0.18362.0'
          $hashes = @{
            'Microsoft.UI.winmd' = 'BA28DFC20E18630F3037AF2B91897082E41F1FA0E1DBB001D900505AB3577FE1'
            'Microsoft.Foundation.winmd' = '56A37D003D6CD568B4BEFC95990AB28F576F128C00033C0372EAE390123F9C1F'
            'Microsoft.Graphics.winmd' = '63165F774C2699E5A44E323F932A10BEE7BD5E11F25D82A730F5FB728107EA83'
          }
          foreach ($entry in $hashes.GetEnumerator()) {
            if ((Get-FileHash -LiteralPath (Join-Path $metadata $entry.Key) -Algorithm SHA256).Hash -ne $entry.Value) {
              throw "Unexpected WinAppSDK metadata: $($entry.Key)"
            }
          }
          $windows = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\UnionMetadata" `
            -Filter Windows.winmd -File -Recurse | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $windows) { throw 'Windows SDK metadata is required for the dispatcher smoke' }
          $output = Join-Path $PWD 'artifacts\dispatcher-implementation-smoke'
          & $env:DYNWINRT_CODEGEN generate `
            --winmd (Join-Path $metadata 'Microsoft.UI.winmd') --ref $windows.FullName `
            --namespace Microsoft.UI.Dispatching --class-name DispatcherQueue `
            --lang py --output $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\bindings\py\.venv\Scripts\python.exe .\tests\e2e\runners\dispatcher_implementation_py.py --generated $output

  e2e-native:
    if: needs.changes.outputs.docs_only == 'false'
    needs: [changes, build-codegen-x64, build-js-test-hooks]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: ci-codegen-x64
          path: artifacts\codegen-x64
      - uses: actions/download-artifact@v4
        with:
          name: ci-js-test-hooks-x64
          path: artifacts\js-test-hooks-x64
      - name: Verify isolated native fixture artifacts
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          .\eng\ci\artifact.ps1 -Mode Verify -Path artifacts\codegen-x64 -Kind codegen -Architecture x64
          .\eng\ci\artifact.ps1 -Mode Verify -Path artifacts\js-test-hooks-x64 -Kind js -Architecture x64 -Features test-hooks
          Copy-Item artifacts\js-test-hooks-x64\payload bindings\js\dist -Recurse
          node bindings\js\scripts\verify-runtime-artifact.mjs bindings\js\dist --test-hooks
          "DYNWINRT_CODEGEN=$((Resolve-Path artifacts\codegen-x64\payload\dynwinrt-codegen.exe).Path)" >> $env:GITHUB_ENV
      - name: Install JS test dependencies
        working-directory: bindings/js
        run: npm install
      - uses: NuGet/setup-nuget@v2
      - name: Install Win32 metadata
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $root = Join-Path $env:RUNNER_TEMP 'win32metadata'
          nuget install Microsoft.Windows.SDK.Win32Metadata `
            -Version 71.0.14-preview -OutputDirectory $root -DirectDownload -NonInteractive
          $winmd = Get-ChildItem $root -Filter Windows.Win32.winmd -File -Recurse | Select-Object -First 1
          if (-not $winmd) { throw 'Microsoft.Windows.SDK.Win32Metadata did not contain Windows.Win32.winmd' }
          "DYNWINRT_WIN32_WINMD=$($winmd.FullName)" >> $env:GITHUB_ENV
          "DYNWINRT_REQUIRE_WIN32_METADATA=1" >> $env:GITHUB_ENV
      # These execute the same tests as the developer npm scripts, but must not
      # run their build:test-hooks prefixes over the downloaded immutable inputs.
      - name: Test JS TSFN lifecycle and queue handling
        working-directory: bindings/js
        run: npx --no-install ava __test__/tsfn.spec.ts
      - name: Test actual generated unsafe COM companion
        working-directory: bindings/js
        run: npx --no-install ava __test__/generated-unsafe-companion.e2e.ts
      - name: Test metadata-driven native COM one-shot completion
        working-directory: bindings/js
        run: npx --no-install ava __test__/native-completion.e2e.ts
      - name: Test metadata-driven COM borrowed copies
        working-directory: bindings/js
        run: npx --no-install ava __test__/borrowed-copy.e2e.ts
      - name: Test Win32 failed-cleanup recovery
        working-directory: bindings/js
        run: node --expose-gc __test__\fixtures\win32-cleanup-errors.cjs

  # Stable check identities also complete on intentional documentation-only skips.
  test:
    if: ${{ always() }}
    needs: [changes, format, test-rust]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require Rust validation
        env:
          NEEDS: ${{ toJSON(needs) }}
          REQUIRED_JOBS: changes,format,test-rust
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          DOCS_SKIPPABLE_JOBS: test-rust
        run: |
          .\eng\ci\assert-success.ps1 -NeedsJson $env:NEEDS -RequiredJobs ($env:REQUIRED_JOBS -split ',') `
            -DocsOnly $env:DOCS_ONLY -SkippableJobs ($env:DOCS_SKIPPABLE_JOBS -split ',')

  e2e:
    if: ${{ always() }}
    needs:
      [
        changes,
        format,
        test,
        build-codegen-x64,
        build-bindings-x64,
        build-js-test-hooks,
        e2e-runtime,
        e2e-native,
      ]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require all E2E lanes
        env:
          NEEDS: ${{ toJSON(needs) }}
          REQUIRED_JOBS: changes,format,test,build-codegen-x64,build-bindings-x64,build-js-test-hooks,e2e-runtime,e2e-native
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          DOCS_SKIPPABLE_JOBS: build-codegen-x64,build-bindings-x64,build-js-test-hooks,e2e-runtime,e2e-native
        run: |
          .\eng\ci\assert-success.ps1 -NeedsJson $env:NEEDS -RequiredJobs ($env:REQUIRED_JOBS -split ',') `
            -DocsOnly $env:DOCS_ONLY -SkippableJobs ($env:DOCS_SKIPPABLE_JOBS -split ',')

  # Only these gated assembly jobs publish the existing release-ready names.
  dynwinrt-codegen:
    if: ${{ always() }}
    needs: [changes, test, e2e, build-codegen-x64, build-arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require all validation
        env:
          NEEDS: ${{ toJSON(needs) }}
          REQUIRED_JOBS: changes,test,e2e,build-codegen-x64,build-arm64
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          DOCS_SKIPPABLE_JOBS: build-codegen-x64,build-arm64
        run: |
          .\eng\ci\assert-success.ps1 -NeedsJson $env:NEEDS -RequiredJobs ($env:REQUIRED_JOBS -split ',') `
            -DocsOnly $env:DOCS_ONLY -SkippableJobs ($env:DOCS_SKIPPABLE_JOBS -split ',')
      - uses: actions/download-artifact@v4
        if: needs.changes.outputs.docs_only == 'false'
        with:
          name: ci-codegen-x64
          path: artifacts\codegen-x64
      - uses: actions/download-artifact@v4
        if: needs.changes.outputs.docs_only == 'false'
        with:
          name: ci-codegen-arm64
          path: artifacts\codegen-arm64
      - name: Assemble verified codegen package
        if: needs.changes.outputs.docs_only == 'false'
        shell: pwsh
        run: |
          .\eng\ci\artifact.ps1 -Mode Verify -Path artifacts\codegen-x64 -Kind codegen -Architecture x64
          .\eng\ci\artifact.ps1 -Mode Verify -Path artifacts\codegen-arm64 -Kind codegen -Architecture arm64
          foreach ($arch in @('x64', 'arm64')) {
            New-Item -ItemType Directory "tools\dynwinrt-codegen\npm\bin\$arch" -Force | Out-Null
            Copy-Item "artifacts\codegen-$arch\payload\dynwinrt-codegen.exe" "tools\dynwinrt-codegen\npm\bin\$arch"
          }
      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.docs_only == 'false'
        with:
          name: dynwinrt-codegen
          path: tools/dynwinrt-codegen/npm/
          if-no-files-found: error

  dynwinrt:
    if: ${{ always() }}
    needs: [changes, test, e2e, build-bindings-x64, build-arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require all validation
        env:
          NEEDS: ${{ toJSON(needs) }}
          REQUIRED_JOBS: changes,test,e2e,build-bindings-x64,build-arm64
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          DOCS_SKIPPABLE_JOBS: build-bindings-x64,build-arm64
        run: |
          .\eng\ci\assert-success.ps1 -NeedsJson $env:NEEDS -RequiredJobs ($env:REQUIRED_JOBS -split ',') `
            -DocsOnly $env:DOCS_ONLY -SkippableJobs ($env:DOCS_SKIPPABLE_JOBS -split ',')
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.docs_only == 'false'
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        if: needs.changes.outputs.docs_only == 'false'
        with:
          name: ci-js-x64
          path: artifacts\js-x64
      - uses: actions/download-artifact@v4
        if: needs.changes.outputs.docs_only == 'false'
        with:
          name: ci-js-arm64
          path: artifacts\js-arm64
      - name: Assemble matching production runtime sidecars
        if: needs.changes.outputs.docs_only == 'false'
        run: .\eng\ci\merge-runtime-artifacts.ps1 -X64 artifacts\js-x64 -Arm64 artifacts\js-arm64 -Output bindings\js\dist
      - name: Install import test dependencies
        if: needs.changes.outputs.docs_only == 'false'
        working-directory: bindings/js
        run: npm install
      - name: Check production native imports
        if: needs.changes.outputs.docs_only == 'false'
        working-directory: bindings/js
        run: npm run test:imports
      - name: Verify assembled JS runtime artifact
        if: needs.changes.outputs.docs_only == 'false'
        run: node .\bindings\js\scripts\verify-runtime-artifact.mjs .\bindings\js\dist
      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.docs_only == 'false'
        with:
          name: dynwinrt
          path: bindings/js/dist/
          if-no-files-found: error
      - uses: actions/download-artifact@v4
        if: needs.changes.outputs.docs_only == 'false'
        with:
          name: dynwinrt
          path: ${{ runner.temp }}\dynwinrt-artifact
      - name: Verify downloaded JS runtime artifact
        if: needs.changes.outputs.docs_only == 'false'
        shell: pwsh
        run: node .\bindings\js\scripts\verify-runtime-artifact.mjs "$env:RUNNER_TEMP\dynwinrt-artifact"

  ci-success:
    if: ${{ always() }}
    needs:
      [
        changes,
        format,
        test-rust,
        test,
        build-codegen-x64,
        build-bindings-x64,
        build-js-test-hooks,
        build-arm64,
        e2e-runtime,
        e2e-native,
        e2e,
        dynwinrt,
        dynwinrt-codegen,
      ]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require every Build job
        env:
          NEEDS: ${{ toJSON(needs) }}
          REQUIRED_JOBS: changes,format,test-rust,test,build-codegen-x64,build-bindings-x64,build-js-test-hooks,build-arm64,e2e-runtime,e2e-native,e2e,dynwinrt,dynwinrt-codegen
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          DOCS_SKIPPABLE_JOBS: test-rust,build-codegen-x64,build-bindings-x64,build-js-test-hooks,build-arm64,e2e-runtime,e2e-native
        run: |
          .\eng\ci\assert-success.ps1 -NeedsJson $env:NEEDS -RequiredJobs ($env:REQUIRED_JOBS -split ',') `
            -DocsOnly $env:DOCS_ONLY -SkippableJobs ($env:DOCS_SKIPPABLE_JOBS -split ',')
