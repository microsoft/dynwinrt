name: Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main, leilzh/*]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  # winrt-meta (x64 + arm64)
  winrt-meta:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - name: Build x64
        run: |
          cargo build -p winrt-meta --release
          mkdir -p tools/winrt-meta/npm/bin/x64
          cp target/release/winrt-meta.exe tools/winrt-meta/npm/bin/x64/
      - name: Build arm64
        run: |
          cargo build -p winrt-meta --release --target aarch64-pc-windows-msvc
          mkdir -p tools/winrt-meta/npm/bin/arm64
          cp target/aarch64-pc-windows-msvc/release/winrt-meta.exe tools/winrt-meta/npm/bin/arm64/
      - uses: actions/upload-artifact@v4
        with:
          name: winrt-meta
          path: tools/winrt-meta/npm/

  # dynwinrt-js (x64 + arm64 in one job)
  dynwinrt-js:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: bindings/js
        run: npm install
      - name: Build x64
        working-directory: bindings/js
        run: npx napi build --no-const-enum --platform --release -o dist
      - name: Build arm64
        working-directory: bindings/js
        run: npx napi build --no-const-enum --platform --release --target aarch64-pc-windows-msvc -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: dynwinrt-js
          path: |
            bindings/js/dist/dynwinrt-js.win32-x64-msvc.node
            bindings/js/dist/dynwinrt-js.win32-arm64-msvc.node
            bindings/js/dist/index.js
            bindings/js/dist/index.d.ts
