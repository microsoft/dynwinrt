[package]
name = "dynwinrt-codegen"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "WinRT metadata reader and typed wrapper code generator for dynwinrt"
repository = "https://github.com/microsoft/dynwinrt"
authors = ["Microsoft"]

[dependencies]
windows-metadata = "0.59.0"
clap = { version = "4", features = ["derive"] }
roxmltree = "0.20"
regex = "1"

[dev-dependencies]
regex = "1"

[dev-dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D_Dxc",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectManipulation",
    "Win32_Media_MediaFoundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
