# WARNING: MANUALLY RUNNING THIS DISPOSABLE BRANCH PERFORMS IRREVERSIBLE PYPI
# PUBLICATION. THIS PIPELINE MUST NEVER BE MERGED.
trigger: none
pr: none

resources:
  repositories:
  - repository: 1esPipelines
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

variables:
  - group: signingIdentity
  - name: releaseTag
    value: v0.1.0-preview.20
  - name: releaseVersion
    value: 0.1.0-preview.20
  - name: pypiVersion
    value: 0.1.0rc20
  - name: packageTarget
    value: both
  - name: publishPyPI
    value: 'true'

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    sdl:
      sourceAnalysisPool:
        name: Azure-Pipelines-1ESPT-ExDShared
        image: windows-latest
        os: windows
    stages:
      - stage: Validate_Collect
        displayName: Validate and collect existing Python wheels
        jobs:
          - job: validate_collect
            displayName: Validate existing GitHub Release wheels
            pool:
              name: Azure-Pipelines-1ESPT-ExDShared
              image: windows-latest
              os: windows
              hostArchitecture: amd64
            steps:
              - checkout: self

              - task: UsePythonVersion@0
                displayName: Setup Python 3.12
                inputs:
                  versionSpec: '3.12'

              - task: PowerShell@2
                displayName: Confirm pinned real-publication inputs
                inputs:
                  targetType: inline
                  script: |
                    $ErrorActionPreference = 'Stop'
                    python -m pip install `
                      --index-url https://packagefeedproxy.microsoft.io/pypi/simple/ `
                      "packaging>=24,<27" --quiet
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

                    $validationScript = @'
                    import os
                    from packaging.version import Version
                    tag = os.environ["RELEASE_TAG"]
                    raw_version = os.environ["RELEASE_VERSION"]
                    pypi_version = os.environ["PYPI_VERSION"]
                    package_target = os.environ["PACKAGE_TARGET"]
                    publish = os.environ["PUBLISH_PYPI"].lower()
                    actual = (tag, raw_version, pypi_version, package_target, publish)
                    expected = (
                        "v0.1.0-preview.20",
                        "0.1.0-preview.20",
                        "0.1.0rc20",
                        "both",
                        "true",
                    )
                    if actual != expected:
                        raise SystemExit(
                            f"Disposable pipeline inputs changed: expected {expected}, "
                            f"got {actual}"
                        )
                    if tag != f"v{raw_version}":
                        raise SystemExit(f"{tag!r} does not match {raw_version!r}")
                    if str(Version(raw_version)) != pypi_version:
                        raise SystemExit(
                            f"{raw_version!r} does not normalize to {pypi_version!r}"
                        )
                    print(f"Release tag: {tag}")
                    print(f"Raw version: {raw_version}")
                    print(f"Normalized PyPI version: {pypi_version}")
                    print(f"Package target: {package_target}")
                    print("Real PyPI publication: enabled")
                    '@
                    $validationScriptPath = Join-Path '$(Agent.TempDirectory)' 'validate-pinned-publication-inputs.py'
                    [System.IO.File]::WriteAllText(
                        $validationScriptPath,
                        $validationScript,
                        [System.Text.UTF8Encoding]::new($false))
                    python $validationScriptPath
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                env:
                  RELEASE_TAG: '${{ variables.releaseTag }}'
                  RELEASE_VERSION: '${{ variables.releaseVersion }}'
                  PYPI_VERSION: '${{ variables.pypiVersion }}'
                  PACKAGE_TARGET: '${{ variables.packageTarget }}'
                  PUBLISH_PYPI: '${{ variables.publishPyPI }}'

              - task: DownloadGitHubRelease@0
                displayName: Download wheels from exact existing GitHub Release
                inputs:
                  connection: 'github-service-connection'
                  userRepository: 'microsoft/dynwinrt'
                  defaultVersionType: 'specificTag'
                  version: '${{ variables.releaseTag }}'
                  itemPattern: '*.whl'
                  downloadPath: '$(Pipeline.Workspace)/python-packages'

              - task: PowerShell@2
                displayName: Verify exact 10-wheel Python release set
                inputs:
                  targetType: inline
                  script: |
                    $ErrorActionPreference = 'Stop'
                    python eng\release\python\verify_python_release.py release-set `
                      --directory "$(Pipeline.Workspace)/python-packages" `
                      --version "${{ variables.pypiVersion }}"
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

              - task: 1ES.PublishPipelineArtifact@1
                displayName: Upload verified Python packages
                inputs:
                  targetPath: '$(Pipeline.Workspace)/python-packages'
                  artifactName: python-packages

      # REAL PUBLICATION: PyPI rejects replacement of an existing filename.
      - stage: Release_PyPI_Runtime
        displayName: Publish dynwinrt to PyPI (irreversible)
        dependsOn: Validate_Collect
        condition: succeeded()
        jobs:
          - job: publish_python_runtime
            displayName: Publish 8 dynwinrt wheels to PyPI
            pool:
              name: Azure-Pipelines-1ESPT-ExDShared
              image: windows-latest
              os: windows
              hostArchitecture: amd64
            templateContext:
              type: releaseJob
              isProduction: true
              inputs:
                - input: pipelineArtifact
                  artifactName: python-packages
                  targetPath: $(Pipeline.Workspace)/python-packages
            steps:
              - task: PowerShell@2
                displayName: Stage exactly 8 runtime wheels
                inputs:
                  targetType: inline
                  script: |
                    $ErrorActionPreference = 'Stop'
                    $source = '$(Pipeline.Workspace)/python-packages'
                    $destination = '$(Pipeline.Workspace)/python-runtime'
                    New-Item $destination -ItemType Directory -Force | Out-Null
                    $wheels = @(Get-ChildItem $source `
                      -Filter 'dynwinrt-*.whl' -File -Recurse)
                    if ($wheels.Count -ne 8) {
                      throw "Expected 8 dynwinrt wheels, found $($wheels.Count)"
                    }
                    $wheels | Copy-Item -Destination $destination

              # SUCCESS HERE IS A REAL, IMMUTABLE PYPI PUBLICATION, NOT A DRY RUN.
              - task: EsrpRelease@10
                displayName: Publish dynwinrt to PyPI via ESRP
                inputs:
                  ConnectedServiceName: $(SigningServiceName)
                  usemanagedidentity: false
                  keyvaultname: $(SigningAKVName)
                  authcertname: $(SigningAuthCertName)
                  signcertname: $(SigningSignCertName)
                  clientid: $(SigningAppId)
                  intent: 'PackageDistribution'
                  contenttype: 'PyPI'
                  contentsource: 'Folder'
                  folderlocation: '$(Pipeline.Workspace)/python-runtime'
                  waitforreleasecompletion: true
                  owners: '$(EsrpOwnersEmail)'
                  approvers: '$(EsrpApproversEmail)'
                  serviceendpointurl: 'https://api.esrp.microsoft.com'
                  mainpublisher: 'ESRPRELPACMAN'
                  domaintenantid: $(SigningTenantId)
                  releasetitle: 'dynwinrt ${{ variables.pypiVersion }}'

      # Codegen cannot start unless all 8 runtime wheels publish successfully.
      - stage: Release_PyPI_Codegen
        displayName: Publish dynwinrt-codegen to PyPI (irreversible)
        dependsOn: Release_PyPI_Runtime
        condition: succeeded()
        jobs:
          - job: publish_python_codegen
            displayName: Publish 2 dynwinrt-codegen wheels to PyPI
            pool:
              name: Azure-Pipelines-1ESPT-ExDShared
              image: windows-latest
              os: windows
              hostArchitecture: amd64
            templateContext:
              type: releaseJob
              isProduction: true
              inputs:
                - input: pipelineArtifact
                  artifactName: python-packages
                  targetPath: $(Pipeline.Workspace)/python-packages
            steps:
              - task: PowerShell@2
                displayName: Stage exactly 2 codegen wheels
                inputs:
                  targetType: inline
                  script: |
                    $ErrorActionPreference = 'Stop'
                    $source = '$(Pipeline.Workspace)/python-packages'
                    $destination = '$(Pipeline.Workspace)/python-codegen'
                    New-Item $destination -ItemType Directory -Force | Out-Null
                    $wheels = @(Get-ChildItem $source `
                      -Filter 'dynwinrt_codegen-*.whl' -File -Recurse)
                    if ($wheels.Count -ne 2) {
                      throw "Expected 2 dynwinrt-codegen wheels, found $($wheels.Count)"
                    }
                    $wheels | Copy-Item -Destination $destination

              # SUCCESS HERE IS A REAL, IMMUTABLE PYPI PUBLICATION, NOT A DRY RUN.
              - task: EsrpRelease@10
                displayName: Publish dynwinrt-codegen to PyPI via ESRP
                inputs:
                  ConnectedServiceName: $(SigningServiceName)
                  usemanagedidentity: false
                  keyvaultname: $(SigningAKVName)
                  authcertname: $(SigningAuthCertName)
                  signcertname: $(SigningSignCertName)
                  clientid: $(SigningAppId)
                  intent: 'PackageDistribution'
                  contenttype: 'PyPI'
                  contentsource: 'Folder'
                  folderlocation: '$(Pipeline.Workspace)/python-codegen'
                  waitforreleasecompletion: true
                  owners: '$(EsrpOwnersEmail)'
                  approvers: '$(EsrpApproversEmail)'
                  serviceendpointurl: 'https://api.esrp.microsoft.com'
                  mainpublisher: 'ESRPRELPACMAN'
                  domaintenantid: $(SigningTenantId)
                  releasetitle: 'dynwinrt-codegen ${{ variables.pypiVersion }}'
