# One-release recovery branch only. Do not merge this pipeline into main.
trigger: none
pr: none

resources:
  repositories:
  - repository: 1esPipelines
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

variables:
  - group: signingIdentity

parameters:
  - name: DoEsrp
    displayName: Publish the original preview.24 packages via ESRP
    type: boolean
    default: false
  - name: PublishPyPI
    displayName: Publish Python packages to PyPI after npm
    type: boolean
    default: true
  - name: signingIdentity
    type: object
    default:
      serviceName: $(SigningServiceName)
      appId: $(SigningAppId)
      tenantId: $(SigningTenantId)
      akvName: $(SigningAKVName)
      authCertName: $(SigningAuthCertName)
      signCertName: $(SigningSignCertName)

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    sdl:
      sourceAnalysisPool:
        name: Azure-Pipelines-1ESPT-ExDShared
        image: windows-latest
        os: windows
    stages:
    - stage: Collect_Python
      displayName: Recover and validate original preview.24 packages
      condition: and(succeeded(), eq(variables['Build.Reason'], 'Manual'))
      jobs:
      - job: collect_python
        pool:
          name: Azure-Pipelines-1ESPT-ExDShared
          image: windows-latest
          os: windows
          hostArchitecture: amd64
        workspace:
          clean: all
        steps:
          - checkout: self
            fetchDepth: 0

          - task: DownloadPipelineArtifact@2
            displayName: Download original npm packages (no rebuild)
            inputs:
              buildType: specific
              project: '71503134-3b3d-4e75-aa3f-25519f1b7d3f'
              definition: '191586'
              buildVersionToDownload: specific
              pipelineId: '162292158'
              allowFailedBuilds: true
              artifactName: npm-packages
              targetPath: '$(Pipeline.Workspace)/original-npm'

          - task: DownloadGitHubRelease@0
            displayName: Download existing preview.24 wheels (read-only)
            inputs:
              connection: 'github-service-connection'
              userRepository: 'microsoft/dynwinrt'
              defaultVersionType: 'specificTag'
              version: 'v0.1.0-preview.24'
              itemPattern: '*.whl'
              downloadPath: '$(Pipeline.Workspace)/python-packages'

          - task: UsePythonVersion@0
            displayName: Setup Python 3.12 using the approved pip mirror
            inputs:
              versionSpec: '3.12'
            env:
              # The downloaded Python installer upgrades pip inside this task.
              PIP_INDEX_URL: https://packagefeedproxy.microsoft.io/pypi/simple/
              PIP_DISABLE_PIP_VERSION_CHECK: '1'

          - task: PowerShell@2
            name: SetMeta
            displayName: Verify provenance and complete release set
            inputs:
              targetType: inline
              script: |
                python -m pip install `
                  --index-url https://packagefeedproxy.microsoft.io/pypi/simple/ `
                  "packaging>=24,<27" --quiet
                if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                python eng\release\preview24_recovery.py `
                  --npm-directory "$(Pipeline.Workspace)/original-npm" `
                  --python-directory "$(Pipeline.Workspace)/python-packages" `
                  --verified-npm-directory "$(Pipeline.Workspace)/npm-packages"
                if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)

          - task: 1ES.PublishPipelineArtifact@1
            displayName: Upload verified original npm packages
            inputs:
              targetPath: '$(Pipeline.Workspace)/npm-packages'
              artifactName: npm-packages

          - task: 1ES.PublishPipelineArtifact@1
            displayName: Upload verified original Python packages
            inputs:
              targetPath: '$(Pipeline.Workspace)/python-packages'
              artifactName: python-packages

    - ${{ if eq(parameters.DoEsrp, 'true') }}:
      - stage: Release_Npm
        displayName: Publish to NPM
        dependsOn:
          - Collect_Python
        variables:
          version: $[ stageDependencies.Collect_Python.collect_python.outputs['SetMeta.version'] ]
        jobs:
        - job: publish_npm
          pool:
            name: Azure-Pipelines-1ESPT-ExDShared
            image: windows-latest
            os: windows
            hostArchitecture: amd64
          displayName: NPM Publish
          templateContext:
            type: releaseJob
            isProduction: true
            inputs:
            - input: pipelineArtifact
              artifactName: npm-packages
              targetPath: $(Pipeline.Workspace)/npm-packages
          steps:
            - task: PowerShell@2
              displayName: Verify service connection
              inputs:
                targetType: inline
                script: |
                  Write-Host "Service Name: ${{ parameters.signingIdentity.serviceName }}"
                  Write-Host "Version: $(version)"
                  Write-Host "Packages:"
                  Get-ChildItem $(Pipeline.Workspace)/npm-packages/

            - task: EsrpRelease@10
              displayName: Publish to NPM via ESRP
              inputs:
                ConnectedServiceName: ${{ parameters.signingIdentity.serviceName }}
                usemanagedidentity: false
                keyvaultname: ${{ parameters.signingIdentity.akvName }}
                authcertname: ${{ parameters.signingIdentity.authCertName }}
                signcertname: ${{ parameters.signingIdentity.signCertName }}
                clientid: ${{ parameters.signingIdentity.appId }}
                intent: 'PackageDistribution'
                contenttype: 'npm'
                contentsource: 'Folder'
                folderlocation: $(Pipeline.Workspace)/npm-packages/
                waitforreleasecompletion: true
                owners: '$(EsrpOwnersEmail)'
                approvers: '$(EsrpApproversEmail)'
                serviceendpointurl: 'https://api.esrp.microsoft.com'
                mainpublisher: 'ESRPRELPACMAN'
                domaintenantid: ${{ parameters.signingIdentity.tenantId }}

    - ${{ if and(eq(parameters.DoEsrp, 'true'), eq(parameters.PublishPyPI, 'true')) }}:
      - stage: Release_PyPI
        displayName: Publish to PyPI
        dependsOn:
          - Collect_Python
          - Release_Npm
        variables:
          version: $[ stageDependencies.Collect_Python.collect_python.outputs['SetMeta.version'] ]
        jobs:
        - job: publish_python_runtime
          pool:
            name: Azure-Pipelines-1ESPT-ExDShared
            image: windows-latest
            os: windows
            hostArchitecture: amd64
          displayName: Publish dynwinrt to PyPI
          templateContext:
            type: releaseJob
            isProduction: true
            inputs:
            - input: pipelineArtifact
              artifactName: python-packages
              targetPath: $(Pipeline.Workspace)/python-packages
          steps:
            - task: PowerShell@2
              displayName: Stage runtime wheels
              inputs:
                targetType: inline
                script: |
                  $destination = '$(Pipeline.Workspace)/python-runtime'
                  New-Item $destination -ItemType Directory -Force | Out-Null
                  $wheels = @(Get-ChildItem '$(Pipeline.Workspace)/python-packages' `
                    -Filter 'dynwinrt-*.whl' -File -Recurse)
                  if ($wheels.Count -ne 8) {
                    throw "Expected 8 dynwinrt wheels, found $($wheels.Count)"
                  }
                  $wheels | Copy-Item -Destination $destination

            - task: EsrpRelease@10
              displayName: Publish dynwinrt to PyPI via ESRP
              inputs:
                ConnectedServiceName: ${{ parameters.signingIdentity.serviceName }}
                usemanagedidentity: false
                keyvaultname: ${{ parameters.signingIdentity.akvName }}
                authcertname: ${{ parameters.signingIdentity.authCertName }}
                signcertname: ${{ parameters.signingIdentity.signCertName }}
                clientid: ${{ parameters.signingIdentity.appId }}
                intent: 'PackageDistribution'
                contenttype: 'PyPI'
                contentsource: 'Folder'
                folderlocation: '$(Pipeline.Workspace)/python-runtime'
                waitforreleasecompletion: true
                owners: '$(EsrpOwnersEmail)'
                approvers: '$(EsrpApproversEmail)'
                serviceendpointurl: 'https://api.esrp.microsoft.com'
                mainpublisher: 'ESRPRELPACMAN'
                domaintenantid: ${{ parameters.signingIdentity.tenantId }}
                releasetitle: 'dynwinrt $(version)'

        - job: publish_python_codegen
          dependsOn: publish_python_runtime
          pool:
            name: Azure-Pipelines-1ESPT-ExDShared
            image: windows-latest
            os: windows
            hostArchitecture: amd64
          displayName: Publish dynwinrt-codegen to PyPI
          templateContext:
            type: releaseJob
            isProduction: true
            inputs:
            - input: pipelineArtifact
              artifactName: python-packages
              targetPath: $(Pipeline.Workspace)/python-packages
          steps:
            - task: PowerShell@2
              displayName: Stage codegen wheels
              inputs:
                targetType: inline
                script: |
                  $destination = '$(Pipeline.Workspace)/python-codegen'
                  New-Item $destination -ItemType Directory -Force | Out-Null
                  $wheels = @(Get-ChildItem '$(Pipeline.Workspace)/python-packages' `
                    -Filter 'dynwinrt_codegen-*.whl' -File -Recurse)
                  if ($wheels.Count -ne 2) {
                    throw "Expected 2 dynwinrt-codegen wheels, found $($wheels.Count)"
                  }
                  $wheels | Copy-Item -Destination $destination

            - task: EsrpRelease@10
              displayName: Publish dynwinrt-codegen to PyPI via ESRP
              inputs:
                ConnectedServiceName: ${{ parameters.signingIdentity.serviceName }}
                usemanagedidentity: false
                keyvaultname: ${{ parameters.signingIdentity.akvName }}
                authcertname: ${{ parameters.signingIdentity.authCertName }}
                signcertname: ${{ parameters.signingIdentity.signCertName }}
                clientid: ${{ parameters.signingIdentity.appId }}
                intent: 'PackageDistribution'
                contenttype: 'PyPI'
                contentsource: 'Folder'
                folderlocation: '$(Pipeline.Workspace)/python-codegen'
                waitforreleasecompletion: true
                owners: '$(EsrpOwnersEmail)'
                approvers: '$(EsrpApproversEmail)'
                serviceendpointurl: 'https://api.esrp.microsoft.com'
                mainpublisher: 'ESRPRELPACMAN'
                domaintenantid: ${{ parameters.signingIdentity.tenantId }}
                releasetitle: 'dynwinrt-codegen $(version)'
