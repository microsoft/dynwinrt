# DISPOSABLE TEST PIPELINE: THIS BRANCH MUST NEVER BE MERGED.
# PublishPyPI=true performs a real, immutable PyPI publication through ESRP.
# It is not a dry run. Always validate with PublishPyPI=false first.
trigger: none
pr: none

resources:
  repositories:
  - repository: 1esPipelines
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

variables:
  - group: signingIdentity

parameters:
  - name: ReleaseTag
    displayName: Existing GitHub Release tag
    type: string
    default: v0.1.0-preview.20
  - name: ConfirmVersion
    displayName: Confirm normalized PyPI version (required for publication)
    type: string
    default: ''
  - name: PublishPyPI
    displayName: Publish to PyPI (REAL AND IRREVERSIBLE)
    type: boolean
    default: false
  - name: PackageTarget
    displayName: Python package target
    type: string
    default: both
    values:
      - both
      - runtime
      - codegen
  - name: signingIdentity
    type: object
    default:
      serviceName: $(SigningServiceName)
      appId: $(SigningAppId)
      tenantId: $(SigningTenantId)
      akvName: $(SigningAKVName)
      authCertName: $(SigningAuthCertName)
      signCertName: $(SigningSignCertName)

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    sdl:
      sourceAnalysisPool:
        name: Azure-Pipelines-1ESPT-ExDShared
        image: windows-latest
        os: windows
    stages:
      - stage: Validate_Collect
        displayName: Validate and collect existing Python wheels
        jobs:
          - job: validate_collect
            displayName: Validate existing GitHub Release wheels
            pool:
              name: Azure-Pipelines-1ESPT-ExDShared
              image: windows-latest
              os: windows
              hostArchitecture: amd64
            steps:
              - checkout: self

              - task: UsePythonVersion@0
                displayName: Setup Python 3.12
                inputs:
                  versionSpec: '3.12'

              - task: PowerShell@2
                displayName: Derive and confirm release version
                inputs:
                  targetType: inline
                  script: |
                    $ErrorActionPreference = 'Stop'
                    python -m pip install `
                      --index-url https://packagefeedproxy.microsoft.io/pypi/simple/ `
                      "packaging>=24,<27" --quiet
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

                    $validationScript = @'
                    import os
                    import re
                    from packaging.version import Version

                    tag = os.environ["RELEASE_TAG"]
                    match = re.fullmatch(r"v(.+)", tag)
                    if not match:
                        raise SystemExit(
                            f"ReleaseTag must exactly match v<version>, got {tag!r}"
                        )

                    raw_version = match.group(1)
                    normalized_version = str(Version(raw_version))
                    publish = os.environ["PUBLISH_PYPI"].lower() == "true"
                    confirm_version = os.environ["CONFIRM_VERSION"]
                    if publish:
                        expected_tag = "v0.1.0-preview.20"
                        expected_version = "0.1.0rc20"
                        if tag != expected_tag or normalized_version != expected_version:
                            raise SystemExit(
                                "This disposable pipeline may publish only "
                                f"{expected_tag} ({expected_version}), got "
                                f"{tag} ({normalized_version})"
                            )
                        if confirm_version != expected_version:
                            raise SystemExit(
                                "PublishPyPI=true requires ConfirmVersion to exactly "
                                f"equal {expected_version!r}; got {confirm_version!r}"
                            )

                    print(f"Release tag: {tag}")
                    print(f"Raw version: {raw_version}")
                    print(f"Normalized PyPI version: {normalized_version}")
                    print(f"##vso[task.setvariable variable=rawVersion]{raw_version}")
                    print(
                        "##vso[task.setvariable variable=normalizedVersion]"
                        f"{normalized_version}"
                    )
                    '@
                    python -c $validationScript
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                env:
                  RELEASE_TAG: '${{ parameters.ReleaseTag }}'
                  CONFIRM_VERSION: '${{ parameters.ConfirmVersion }}'
                  PUBLISH_PYPI: '${{ parameters.PublishPyPI }}'

              - task: DownloadGitHubRelease@0
                displayName: Download wheels from exact existing GitHub Release
                inputs:
                  connection: 'github-service-connection'
                  userRepository: 'microsoft/dynwinrt'
                  defaultVersionType: 'specificTag'
                  version: '${{ parameters.ReleaseTag }}'
                  itemPattern: '*.whl'
                  downloadPath: '$(Pipeline.Workspace)/python-packages'

              - task: PowerShell@2
                displayName: Verify exact 10-wheel Python release set
                inputs:
                  targetType: inline
                  script: |
                    $ErrorActionPreference = 'Stop'
                    python eng\release\python\verify_python_release.py release-set `
                      --directory "$(Pipeline.Workspace)/python-packages" `
                      --version "$(normalizedVersion)"
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

              - task: 1ES.PublishPipelineArtifact@1
                displayName: Upload verified Python packages
                inputs:
                  targetPath: '$(Pipeline.Workspace)/python-packages'
                  artifactName: python-packages

      # REAL PUBLICATION: PyPI rejects replacement of an existing filename.
      # This stage is omitted entirely unless PublishPyPI=true.
      - ${{ if and(eq(parameters.PublishPyPI, true), eq(parameters.ReleaseTag, 'v0.1.0-preview.20'), eq(parameters.ConfirmVersion, '0.1.0rc20'), or(eq(parameters.PackageTarget, 'both'), eq(parameters.PackageTarget, 'runtime'))) }}:
        - stage: Release_PyPI_Runtime
          displayName: Publish dynwinrt to PyPI (irreversible)
          dependsOn: Validate_Collect
          jobs:
            - job: publish_python_runtime
              displayName: Publish 8 dynwinrt wheels to PyPI
              pool:
                name: Azure-Pipelines-1ESPT-ExDShared
                image: windows-latest
                os: windows
                hostArchitecture: amd64
              templateContext:
                type: releaseJob
                isProduction: true
                inputs:
                  - input: pipelineArtifact
                    artifactName: python-packages
                    targetPath: $(Pipeline.Workspace)/python-packages
              steps:
                - task: PowerShell@2
                  displayName: Stage exactly 8 runtime wheels
                  inputs:
                    targetType: inline
                    script: |
                      $ErrorActionPreference = 'Stop'
                      $source = '$(Pipeline.Workspace)/python-packages'
                      $destination = '$(Pipeline.Workspace)/python-runtime'
                      New-Item $destination -ItemType Directory -Force | Out-Null
                      $wheels = @(Get-ChildItem $source `
                        -Filter 'dynwinrt-*.whl' -File -Recurse)
                      if ($wheels.Count -ne 8) {
                        throw "Expected 8 dynwinrt wheels, found $($wheels.Count)"
                      }
                      $wheels | Copy-Item -Destination $destination

                # SUCCESS HERE IS A REAL, IMMUTABLE PYPI PUBLICATION, NOT A DRY RUN.
                - task: EsrpRelease@10
                  displayName: Publish dynwinrt to PyPI via ESRP
                  inputs:
                    ConnectedServiceName: ${{ parameters.signingIdentity.serviceName }}
                    usemanagedidentity: false
                    keyvaultname: ${{ parameters.signingIdentity.akvName }}
                    authcertname: ${{ parameters.signingIdentity.authCertName }}
                    signcertname: ${{ parameters.signingIdentity.signCertName }}
                    clientid: ${{ parameters.signingIdentity.appId }}
                    intent: 'PackageDistribution'
                    contenttype: 'PyPI'
                    contentsource: 'Folder'
                    folderlocation: '$(Pipeline.Workspace)/python-runtime'
                    waitforreleasecompletion: true
                    owners: '$(EsrpOwnersEmail)'
                    approvers: '$(EsrpApproversEmail)'
                    serviceendpointurl: 'https://api.esrp.microsoft.com'
                    mainpublisher: 'ESRPRELPACMAN'
                    domaintenantid: ${{ parameters.signingIdentity.tenantId }}
                    releasetitle: 'dynwinrt ${{ parameters.ConfirmVersion }}'

      # For PackageTarget=both, codegen waits for runtime so all 8 runtime wheels
      # publish before the 2 codegen wheels. A codegen-only retry is independent.
      - ${{ if and(eq(parameters.PublishPyPI, true), eq(parameters.ReleaseTag, 'v0.1.0-preview.20'), eq(parameters.ConfirmVersion, '0.1.0rc20'), eq(parameters.PackageTarget, 'both')) }}:
        - stage: Release_PyPI_Codegen
          displayName: Publish dynwinrt-codegen to PyPI (irreversible)
          dependsOn: Release_PyPI_Runtime
          jobs:
            - job: publish_python_codegen
              displayName: Publish 2 dynwinrt-codegen wheels to PyPI
              pool:
                name: Azure-Pipelines-1ESPT-ExDShared
                image: windows-latest
                os: windows
                hostArchitecture: amd64
              templateContext:
                type: releaseJob
                isProduction: true
                inputs:
                  - input: pipelineArtifact
                    artifactName: python-packages
                    targetPath: $(Pipeline.Workspace)/python-packages
              steps:
                - task: PowerShell@2
                  displayName: Stage exactly 2 codegen wheels
                  inputs:
                    targetType: inline
                    script: |
                      $ErrorActionPreference = 'Stop'
                      $source = '$(Pipeline.Workspace)/python-packages'
                      $destination = '$(Pipeline.Workspace)/python-codegen'
                      New-Item $destination -ItemType Directory -Force | Out-Null
                      $wheels = @(Get-ChildItem $source `
                        -Filter 'dynwinrt_codegen-*.whl' -File -Recurse)
                      if ($wheels.Count -ne 2) {
                        throw "Expected 2 dynwinrt-codegen wheels, found $($wheels.Count)"
                      }
                      $wheels | Copy-Item -Destination $destination

                # SUCCESS HERE IS A REAL, IMMUTABLE PYPI PUBLICATION, NOT A DRY RUN.
                - task: EsrpRelease@10
                  displayName: Publish dynwinrt-codegen to PyPI via ESRP
                  inputs:
                    ConnectedServiceName: ${{ parameters.signingIdentity.serviceName }}
                    usemanagedidentity: false
                    keyvaultname: ${{ parameters.signingIdentity.akvName }}
                    authcertname: ${{ parameters.signingIdentity.authCertName }}
                    signcertname: ${{ parameters.signingIdentity.signCertName }}
                    clientid: ${{ parameters.signingIdentity.appId }}
                    intent: 'PackageDistribution'
                    contenttype: 'PyPI'
                    contentsource: 'Folder'
                    folderlocation: '$(Pipeline.Workspace)/python-codegen'
                    waitforreleasecompletion: true
                    owners: '$(EsrpOwnersEmail)'
                    approvers: '$(EsrpApproversEmail)'
                    serviceendpointurl: 'https://api.esrp.microsoft.com'
                    mainpublisher: 'ESRPRELPACMAN'
                    domaintenantid: ${{ parameters.signingIdentity.tenantId }}
                    releasetitle: 'dynwinrt-codegen ${{ parameters.ConfirmVersion }}'

      - ${{ if and(eq(parameters.PublishPyPI, true), eq(parameters.ReleaseTag, 'v0.1.0-preview.20'), eq(parameters.ConfirmVersion, '0.1.0rc20'), eq(parameters.PackageTarget, 'codegen')) }}:
        - stage: Release_PyPI_Codegen
          displayName: Publish dynwinrt-codegen to PyPI (irreversible retry)
          dependsOn: Validate_Collect
          jobs:
            - job: publish_python_codegen
              displayName: Publish 2 dynwinrt-codegen wheels to PyPI
              pool:
                name: Azure-Pipelines-1ESPT-ExDShared
                image: windows-latest
                os: windows
                hostArchitecture: amd64
              templateContext:
                type: releaseJob
                isProduction: true
                inputs:
                  - input: pipelineArtifact
                    artifactName: python-packages
                    targetPath: $(Pipeline.Workspace)/python-packages
              steps:
                - task: PowerShell@2
                  displayName: Stage exactly 2 codegen wheels
                  inputs:
                    targetType: inline
                    script: |
                      $ErrorActionPreference = 'Stop'
                      $source = '$(Pipeline.Workspace)/python-packages'
                      $destination = '$(Pipeline.Workspace)/python-codegen'
                      New-Item $destination -ItemType Directory -Force | Out-Null
                      $wheels = @(Get-ChildItem $source `
                        -Filter 'dynwinrt_codegen-*.whl' -File -Recurse)
                      if ($wheels.Count -ne 2) {
                        throw "Expected 2 dynwinrt-codegen wheels, found $($wheels.Count)"
                      }
                      $wheels | Copy-Item -Destination $destination

                # SUCCESS HERE IS A REAL, IMMUTABLE PYPI PUBLICATION, NOT A DRY RUN.
                - task: EsrpRelease@10
                  displayName: Publish dynwinrt-codegen to PyPI via ESRP
                  inputs:
                    ConnectedServiceName: ${{ parameters.signingIdentity.serviceName }}
                    usemanagedidentity: false
                    keyvaultname: ${{ parameters.signingIdentity.akvName }}
                    authcertname: ${{ parameters.signingIdentity.authCertName }}
                    signcertname: ${{ parameters.signingIdentity.signCertName }}
                    clientid: ${{ parameters.signingIdentity.appId }}
                    intent: 'PackageDistribution'
                    contenttype: 'PyPI'
                    contentsource: 'Folder'
                    folderlocation: '$(Pipeline.Workspace)/python-codegen'
                    waitforreleasecompletion: true
                    owners: '$(EsrpOwnersEmail)'
                    approvers: '$(EsrpApproversEmail)'
                    serviceendpointurl: 'https://api.esrp.microsoft.com'
                    mainpublisher: 'ESRPRELPACMAN'
                    domaintenantid: ${{ parameters.signingIdentity.tenantId }}
                    releasetitle: 'dynwinrt-codegen ${{ parameters.ConfirmVersion }}'
