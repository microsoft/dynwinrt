trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

resources:
  repositories:
  - repository: 1esPipelines
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  template: v1/1ES.Unofficial.PipelineTemplate.yml@1esPipelines
  parameters:
    sdl:
      sourceAnalysisPool:
        name: Azure-Pipelines-1ESPT-ExDShared
        image: windows-latest
        os: windows
    stages:
    - stage: Build
      jobs:
      - job: Build
        pool:
          name: Azure-Pipelines-1ESPT-ExDShared
          image: windows-latest
          os: windows
          hostArchitecture: amd64
        steps:
          - checkout: self

          - task: UseNode@1
            displayName: Setup Node.js 24
            inputs:
              version: '24.x'

          # Install Rust toolchain with ARM64 target
          - task: PowerShell@2
            displayName: Install Rust toolchain
            inputs:
              targetType: inline
              script: |
                Invoke-WebRequest -Uri https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
                .\rustup-init.exe -y --default-toolchain stable --target aarch64-pc-windows-msvc
                $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
                echo "##vso[task.prependpath]$env:USERPROFILE\.cargo\bin"
                rustc --version
                cargo --version

          # Configure Cargo to use Azure Artifacts feed with auth
          - task: PowerShell@2
            displayName: Configure Cargo for Azure Artifacts feed
            inputs:
              targetType: inline
              script: |
                $feedUrl = "sparse+https://pkgs.dev.azure.com/microsoft/pde-oss/_packaging/dynwinrt-cargo/Cargo/index/"

                # Project-level config: registry + source replacement
                New-Item -ItemType Directory -Path .cargo -Force | Out-Null
                @"
                [registries]
                dynwinrt-cargo = { index = "$feedUrl" }

                [source.crates-io]
                replace-with = "dynwinrt-cargo"

                [source.dynwinrt-cargo]
                registry = "$feedUrl"
                "@ | Set-Content .cargo/config.toml

                # User-level config: credential providers.
                # Omits cargo:wincred (its RPC stub crashes with `os error 1783`
                # on some hosted ADO Windows images during the `cargo login`
                # write path). cargo:token reads the credentials.toml written
                # below, which is all CI needs.
                $userConfig = "$env:USERPROFILE\.cargo\config.toml"
                New-Item -ItemType Directory -Path "$env:USERPROFILE\.cargo" -Force | Out-Null
                @"
                [registry]
                global-credential-providers = ["cargo:token"]
                "@ | Set-Content $userConfig

                # Write token directly to credentials.toml — bypasses the
                # deprecated `cargo login <token>` stdin path entirely.
                $token = "Basic " + [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("PAT:$env:SYSTEM_ACCESSTOKEN"))
                $credsPath = "$env:USERPROFILE\.cargo\credentials.toml"
                @"
                [registries.dynwinrt-cargo]
                token = "$token"
                "@ | Set-Content $credsPath

                Write-Host "Configured Cargo feed with auth"
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)

          # Core library tests
          - task: PowerShell@2
            displayName: Test core library
            inputs:
              targetType: inline
              script: cargo test -p dynwinrt

          # dynwinrt-codegen tests
          - task: PowerShell@2
            displayName: Test dynwinrt-codegen
            inputs:
              targetType: inline
              script: cargo test -p dynwinrt-codegen

          # Build dynwinrt-codegen (x64 + arm64)
          - task: PowerShell@2
            displayName: Build dynwinrt-codegen (x64)
            inputs:
              targetType: inline
              script: cargo build -p dynwinrt-codegen --release

          - task: PowerShell@2
            displayName: Build dynwinrt-codegen (arm64)
            inputs:
              targetType: inline
              script: cargo build -p dynwinrt-codegen --release --target aarch64-pc-windows-msvc

          # Build dynwinrt (x64 + arm64)
          - task: PowerShell@2
            displayName: Configure npm for Azure Artifacts feed
            inputs:
              targetType: inline
              workingDirectory: bindings/js
              script: |
                @"
                registry=https://pkgs.dev.azure.com/microsoft/pde-oss/_packaging/dynwinrt-npm/npm/registry/
                always-auth=true
                "@ | Set-Content .npmrc
                Write-Host "Configured .npmrc for Azure Artifacts"

          - task: npmAuthenticate@0
            displayName: Authenticate npm feed
            inputs:
              workingFile: bindings/js/.npmrc

          - task: PowerShell@2
            displayName: Install JS binding dependencies
            inputs:
              targetType: inline
              workingDirectory: bindings/js
              script: npm install

          - task: PowerShell@2
            displayName: Build dynwinrt (x64)
            inputs:
              targetType: inline
              workingDirectory: bindings/js
              script: npx napi build --no-const-enum --platform --release -o dist

          - task: PowerShell@2
            displayName: Build dynwinrt (arm64)
            inputs:
              targetType: inline
              workingDirectory: bindings/js
              script: npx napi build --no-const-enum --platform --release --target aarch64-pc-windows-msvc -o dist

          # Install tsx for E2E TS runner
          - task: PowerShell@2
            displayName: Install tsx
            inputs:
              targetType: inline
              workingDirectory: bindings/js
              script: npm install --no-save tsx

          # Build Python binding
          - task: UsePythonVersion@0
            displayName: Setup Python 3.12
            inputs:
              versionSpec: '3.12'

          - task: PipAuthenticate@1
            displayName: Authenticate Python feed
            inputs:
              artifactFeeds: 'pde-oss/dynwinrt-python'

          - task: PowerShell@2
            displayName: Build Python binding
            inputs:
              targetType: inline
              script: |
                cd bindings/py
                python -m venv .venv
                .venv/Scripts/Activate.ps1

                # Configure pip to use Azure Artifacts feed
                $pipIni = ".venv/pip.ini"
                @"
                [global]
                index-url=https://pkgs.dev.azure.com/microsoft/pde-oss/_packaging/dynwinrt-python/pypi/simple/
                "@ | Set-Content $pipIni

                pip install pytest maturin --quiet
                if ($LASTEXITCODE -ne 0) { Write-Error "pip install failed"; exit 1 }
                maturin build --quiet
                if ($LASTEXITCODE -ne 0) { Write-Error "maturin build failed"; exit 1 }
                $whl = (Get-ChildItem ../../target/wheels/*.whl | Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
                if (-not $whl) { Write-Error "No wheel found"; exit 1 }
                pip install $whl --force-reinstall --quiet
                if ($LASTEXITCODE -ne 0) { Write-Error "pip install failed"; exit 1 }

          # E2E tests: winmd → generate → call real WinRT APIs
          - task: PowerShell@2
            displayName: Run E2E tests (40 tests)
            inputs:
              targetType: inline
              script: |
                cd bindings/py
                if (Test-Path .venv) { .venv/Scripts/Activate.ps1 }
                cd ../..
                .\tests\e2e_test.ps1 -SkipBuild


